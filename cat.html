<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Cats</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif; 
            margin: 0;
            padding: 0;
            background-color: #BDD9E8; /* 蓝色背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column; /* 垂直布局 */
        }

        .photo-container {
            display: flex;
            gap: 40px; /* 图片之间的间距 */
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 90%; /* 容器宽度为全屏 */
        }

        /* 单张图片样式 */
        .photo-container img {
            width: 90%; /* 图片宽度为容器的 90% */
            max-width: 300px; /* 最大宽度为 300px */
            height: auto;
            border-radius: 10px; /* 圆角 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* 阴影效果 */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer; /* 鼠标变成手形 */
        }

        /* 悬停时图片放大效果，不旋转 */
        .photo-container img:hover {
            transform: scale(1.1); /* 放大 */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3); /* 增强阴影 */
        }

        /* 动态渐入动画 */
        .photo-container img {
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .greeting {
            font-size: 2em;
            color: #000; /* 黑色文字 */
            margin-bottom: 20px;
            animation: slideDown 1s ease-in-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .photo-container img {
                width: 100%;
                max-width: 250px; /* 小屏幕最大宽度 */
            }
        }

        /* 全屏查看图片的样式 */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            cursor: pointer; /* 设置点击光标 */
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

        /* 点击外部关闭光箱 */
        .lightbox:target {
            display: flex;
        }

    </style>
</head>
<body>
   

    <!-- 图片容器 -->

    <div class="photo-container">
        <a href="#lightbox3"><img src="assets/img/cat6.jpg" alt="Cute cat 3"></a>
        <a href="#lightbox4"><img src="assets/img/cat4.jpg" alt="Cute cat 4"></a>
        <a href="#lightbox6"><img src="assets/img/cat3.jpg" alt="Cute cat 6"></a>
           <a href="#lightbox1"><img src="assets/img/cat1.jpg" alt="Cute cat 1"></a>
    </div>

    <!-- Lightbox 弹出图片 -->
    <div id="lightbox1" class="lightbox" onclick="window.location.hash='';">
        <img src="assets/img/cat1.jpg" alt="Cute cat 1">
    </div>

  

    <div id="lightbox3" class="lightbox" onclick="window.location.hash='';">
        <img src="assets/img/cat6.jpg" alt="Cute cat 3">
    </div>

    <div id="lightbox4" class="lightbox" onclick="window.location.hash='';">
        <img src="assets/img/cat4.jpg" alt="Cute cat 1">
    </div>

   

    <div id="lightbox6" class="lightbox" onclick="window.location.hash='';">
        <img src="assets/img/cat3.jpg" alt="Cute cat 3">
    </div>
    
</body>
</html>
